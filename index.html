<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor Scanner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Розпізнавання Резисторів</h1>

    <!-- Вибір файлу -->
    <input type="file" id="fileInput" accept="image/*">
    
    <!-- Контейнер для вікна з можливістю прокручування -->
    <div id="imageContainer">
        <canvas id="canvasOutput"></canvas>
    </div>
	<div class="controls">
    	<button id="moveLeft">
        	<img src="icons/arrow-left.svg" alt="Left">
    	</button>
	    <button id="moveRight">
    	    <img src="icons/arrow-right.svg" alt="Right">
    	</button>
    	<button id="moveUp">
        	<img src="icons/arrow-up.svg" alt="Up">
    	</button>
    	<button id="moveDown">
        	<img src="icons/arrow-down.svg" alt="Down">
    	</button>
    	<button id="zoomOut">
        	<img src="icons/minus.svg" alt="Zoom Out">
    	</button>
    	<button id="zoomIn">
        	<img src="icons/plus.svg" alt="Zoom In">
    	</button>
    	<button id="resetZoom">
        	<img src="icons/reset.svg" alt="Reset Zoom">
    	</button>
	</div>


    <script src="renderer.js"></script>
</body>
</html>
